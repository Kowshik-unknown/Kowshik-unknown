<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="tech loadout">
  <defs>
    <linearGradient id="shBg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a5cff" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#8a5cff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#05070f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shRule" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a5cff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#8a5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shClip"><rect x="0" y="6" width="1200" height="50" rx="9"/></clipPath>
    <style>
      .sh-mono { font-family: 'Courier New', ui-monospace, monospace; }
      .sh-title { font-family: 'Arial Black','Segoe UI',Ubuntu,sans-serif; font-weight: 900; font-size: 25px; letter-spacing: 3.4px; }
      .sh-blink { animation: shBlink 1.9s steps(1) infinite; }
      .sh-scan { animation: shScan 5.4s linear infinite; }
      @keyframes shBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0.15; } }
      @keyframes shScan {
        0% { transform: translateX(-80px); opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(1260px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- plaque -->
  <rect x="0" y="6" width="1200" height="50" rx="9" fill="#070b16"/>
  <rect x="0" y="6" width="1200" height="50" rx="9" fill="url(#shBg)"/>
  <rect x="0.6" y="6.6" width="1198.8" height="48.8" rx="9" fill="none" stroke="#8a5cff" stroke-opacity="0.45" stroke-width="1.2"/>

  <g clip-path="url(#shClip)">
    <g class="sh-scan"><rect x="0" y="6" width="54" height="50" fill="#8a5cff" opacity="0.09"/></g>
    <rect x="16" y="6" width="3.5" height="50" fill="#8a5cff" filter="url(#shGlow)"/>
    <rect x="26" y="6" width="1.4" height="50" fill="#8a5cff" opacity="0.35"/>
  </g>

  <!-- number badge -->
  <g transform="translate(44,31)">
    <rect x="-17" y="-13" width="34" height="26" rx="6" fill="#8a5cff" fill-opacity="0.1" stroke="#8a5cff" stroke-opacity="0.65"/>
    <text x="0" y="6" class="sh-mono" font-size="15" font-weight="700" text-anchor="middle" fill="#8a5cff" filter="url(#shGlow)">03</text>
  </g>

  <!-- title + underline -->
  <text x="74" y="39" class="sh-title" fill="#f4fbff" filter="url(#shGlow)">TECH LOADOUT</text>
  <rect x="76" y="46" width="330" height="1.6" fill="url(#shRule)"/>

  <!-- equalizer -->
  <g fill="#8a5cff" opacity="0.8">
    <rect x="1024" y="33" width="2.6" height="7"><animate attributeName="height" values="4;9;6;10;4" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="36;31;34;30;36" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="1030" y="31" width="2.6" height="9"><animate attributeName="height" values="10;5;11;6;10" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="30;35;29;34;30" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="1036" y="34" width="2.6" height="6"><animate attributeName="height" values="6;11;4;9;6" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="34;29;36;31;34" dur="1.4s" repeatCount="indefinite"/></rect>
  </g>
  <!-- right meta -->
  <text x="1180" y="30" class="sh-mono" font-size="9" letter-spacing="2.4" text-anchor="end" fill="#8a5cff" fill-opacity="0.85">EQUIPPED MODULES</text>
  <text x="1180" y="45" class="sh-mono" font-size="8" letter-spacing="2" text-anchor="end" fill="#5c7090">REC <tspan class="sh-blink" fill="#ff2bd6">●</tspan> 00:03</text>

</svg>