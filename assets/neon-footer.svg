<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Neon arcade footer">
  <defs>
    <linearGradient id="ftBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04050a"/>
      <stop offset="0.5" stop-color="#0a0616"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="ftRule" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00f5ff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#8a5cff" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#ff2bd6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ftFrame" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#8a5cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="ftGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a5cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ftSoft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ftHard" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ftClip"><rect x="1" y="1" width="1198" height="178" rx="18"/></clipPath>
    <style>
      .m { font-family: 'Courier New', ui-monospace, monospace; }
      .blink { animation: ftBlink 1.3s steps(1) infinite; }
      .flicker { animation: ftFlicker 5s steps(1) infinite; }
      .drift { animation: ftDrift 22s linear infinite; }
      @keyframes ftBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0.18; } }
      @keyframes ftFlicker {
        0%, 84%, 100% { opacity: 1; }
        85% { opacity: 0.35; }
        86% { opacity: 1; }
        92% { opacity: 0.5; }
        93% { opacity: 1; }
      }
      @keyframes ftDrift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    </style>
  </defs>

  <g clip-path="url(#ftClip)">
    <rect width="1200" height="180" fill="url(#ftBg)"/>
    <ellipse cx="600" cy="150" rx="520" ry="150" fill="url(#ftGlow)"/>
    <!-- perspective floor -->
    <g opacity="0.35" stroke="#00f5ff" stroke-width="0.8">
      <line x1="0" y1="132" x2="1200" y2="132" stroke="url(#ftRule)" stroke-width="1.4"/>
      <line x1="0" y1="150" x2="1200" y2="150" stroke="#ff2bd6" stroke-opacity="0.4"/>
      <line x1="0" y1="168" x2="1200" y2="168" stroke="#8a5cff" stroke-opacity="0.35"/>
      <line x1="600" y1="132" x2="380" y2="180"/>
      <line x1="600" y1="132" x2="820" y2="180"/>
      <line x1="600" y1="132" x2="120" y2="180"/>
      <line x1="600" y1="132" x2="1080" y2="180"/>
    </g>
    <!-- marching sprites -->
    <g class="drift" opacity="0.5">
      <g fill="#00f5ff">
        <rect x="40" y="104" width="4" height="4"/><rect x="52" y="104" width="4" height="4"/>
        <rect x="36" y="108" width="24" height="6"/><rect x="40" y="114" width="4" height="3" fill="#04050a"/>
        <rect x="52" y="114" width="4" height="3" fill="#04050a"/>
        <rect x="36" y="117" width="7" height="3"/><rect x="53" y="117" width="7" height="3"/>
      </g>
      <g fill="#ff2bd6" transform="translate(600,0)">
        <rect x="40" y="104" width="4" height="4"/><rect x="52" y="104" width="4" height="4"/>
        <rect x="36" y="108" width="24" height="6"/><rect x="40" y="114" width="4" height="3" fill="#04050a"/>
        <rect x="52" y="114" width="4" height="3" fill="#04050a"/>
        <rect x="36" y="117" width="7" height="3"/><rect x="53" y="117" width="7" height="3"/>
      </g>
    </g>

    <text x="600" y="62" class="m flicker" font-size="11" letter-spacing="6" text-anchor="middle" fill="#7fe9f7">— CONTINUE ? —</text>
    <text x="600" y="98" font-family="'Arial Black','Segoe UI',Ubuntu,sans-serif" font-size="30" font-weight="900" letter-spacing="3" text-anchor="middle" fill="#eafcff" filter="url(#ftSoft)">THANKS FOR PLAYING</text>

    <g class="m" font-size="8.5" letter-spacing="2.4" fill="#5c7090">
      <text x="40" y="162">© 2026 RAMISETTY KOWSHIK</text>
      <text x="600" y="162" text-anchor="middle" fill="#b6ff3b">CREDITS <tspan class="blink">●</tspan> 01</text>
      <text x="1160" y="162" text-anchor="end" fill="#7fe9f7">INSERT COIN TO CONNECT</text>
    </g>
    <g transform="translate(1132,40)" opacity="0.8">
      <circle cx="0" cy="0" r="9" fill="#05070f" stroke="#b6ff3b" stroke-width="1.4" filter="url(#ftHard)"/>
      <text x="0" y="3.5" class="m" font-size="9" font-weight="700" text-anchor="middle" fill="#b6ff3b">K</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="178" rx="18" fill="none" stroke="url(#ftFrame)" stroke-width="1.4"/>
</svg>