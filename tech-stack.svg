    <rect class="card-bg" width="250" height="60" />
    <rect class="base-border" width="250" height="60" stroke="#ffca28" />
    <rect class="orbit-glow d1" width="250" height="60" stroke="#ffca28" />
    <text x="38" y="32" class="icon">🔥</text>
    <text x="68" y="31" class="label">Firebase</text>
  </g>
  <g transform="translate(295, 248)">
