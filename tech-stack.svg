<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="500">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .bg { fill: #0a0e17; rx: 20px; }
      .card-bg { fill: #111827; rx: 16px; ry: 16px; }
      .base-border { fill: none; stroke-width: 1.5; rx: 16px; ry: 16px; opacity: 0.28; }
      .orbit-glow {
        fill: none;
        stroke-width: 3;
        rx: 16px;
        ry: 16px;
        stroke-linecap: round;
        stroke-dasharray: 85 211;
        filter: url(#glow);
        animation: orbit 4s linear infinite, pulse 2.5s ease-in-out infinite alternate;
      }
      .d1 { animation-delay: -0.5s; }
      .d2 { animation-delay: -1.5s; }
      .d3 { animation-delay: -2.5s; }
      .label {
        font-family: 'Segoe UI', Ubuntu, Sans-Serif;
        font-size: 16px;
        font-weight: 700;
        fill: #f8fafc;
        dominant-baseline: middle;
      }
      .icon {
        font-size: 22px;
        dominant-baseline: middle;
        text-anchor: middle;
        animation: float 3s ease-in-out infinite alternate;
      }
      @keyframes orbit {
        from { stroke-dashoffset: 592; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { opacity: 0.65; stroke-width: 2.2; }
        100% { opacity: 1; stroke-width: 3.6; }
      }
      @keyframes float {
        0% { transform: translateY(-1.5px); }
        100% { transform: translateY(1.5px); }
      }
    </style>
  </defs>

  <rect class="bg" width="840" height="500" />

  <!-- ROW 1 -->
  <g transform="translate(20, 20)">
    <rect class="card-bg" width="250" height="60" />
    <rect class="base-border" width="250" height="60" stroke="#ff5722" />
    <rect class="orbit-glow d1" width="250" height="60" stroke="#ff5722" />
    <text x="38" y="32" class="icon">🌐</text>
    <text x="68" y="31" class="label">HTML5</text>
  </g>
  <g transform="translate(295, 20)">
    <rect class="card-bg" width="250" height="60" />
    <rect class="base-border" width="250" height="60" stroke="#00b4d8" />
    <rect class="orbit-glow d2" width="250" height="60" stroke="#00b4d8" />
    <text x="38" y="32" class="icon">🎨</text>
    <text x="68" y="31" class="label">CSS3 &amp; Flexbox</text>
  </g>
  <g transform="translate(570, 20)">
    <rect class="card-bg" width="250" height="60" />
    <rect class="base-border" width="250" height="60" stroke="#f7df1e" />
    <rect class="orbit-glow d3" width="250" height="60" stroke="#f7df1e" />
    <text x="38" y="32" class="icon">⚡</text>
    <text x="68" y="31" class="label">JavaScript</text>
  </g>

  <!-- ROW 2 -->
  <g transform="translate(20, 96)">
    <rect class="card-bg" width="250" height="60" />
    <rect class="base-border" width="250" height="60" stroke="#38bdf8" />
    <rect class="orbit-glow d2" width="250" height="60" stroke="#38bdf8" />
    <text x="38" y="32" class="icon">🐍</text>
