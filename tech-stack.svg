  </g>
  <g transform="translate(570, 400)">
    <rect class="card-bg" width="250" height="60" />
    <rect class="base-border" width="250" height="60" stroke="#34a853" />
    <rect class="orbit-glow d2" width="250" height="60" stroke="#34a853" />
    <text x="38" y="32" class="icon">📈</text>
    <text x="68" y="31" class="label">Google Ads</text>
