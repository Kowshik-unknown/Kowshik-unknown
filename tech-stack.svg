    <rect class="base-border" width="250" height="60" stroke="#ff007f" />
    <rect class="orbit-glow d1" width="250" height="60" stroke="#ff007f" />
    <text x="38" y="32" class="icon">✨</text>
    <text x="68" y="31" class="label">Vibe Coding</text>
