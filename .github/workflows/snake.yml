name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate neon snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Neon arcade palette: empty -> low -> high contribution cells + cyan snake
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300F5FF&color_dots=%230b1220,%2312324a,%230a7f95,%2300d9f5,%23ff2bd6
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
